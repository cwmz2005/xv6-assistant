<!doctype html><html lang="zh"><meta charset="utf-8"><title>xv6 ? ???</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><body class="bg-light"><div class="container py-4"><h3>xv6 <small class="text-secondary">???</small></h3><div class="row mt-4"><aside class="col-3"><button class="btn btn-dark" onclick="newSession()">???</button><div id="sessions" class="list-group mt-3"></div><button class="btn btn-link" onclick="docs()">?????</button></aside><main class="col-9"><div id="messages" class="card p-4 mb-3" style="min-height:50vh"></div><textarea id="question" class="form-control" placeholder="?? xv6"></textarea><div class="d-flex gap-3 my-3"><button class="btn btn-dark" onclick="send()">??</button><button class="btn btn-outline-secondary" onclick="debugSearch()">????</button><label><input id="rag" type="checkbox" checked> RAG</label><label><input id="rerank" type="checkbox"> Reranker</label><select id="strategy" class="form-select w-auto"><option>hybrid</option><option>dense</option><option>bm25</option></select></div><details><summary>???????</summary><label>Top K <input id="top" type="number" value="5" min="1" max="30"></label><p>?? Baseline??? RAG??Dense?Hybrid?Hybrid + Reranker????????????????????</p><pre id="details"></pre></details></main></div></div><script>
let sid;const el=id=>document.getElementById(id);async function api(path,body){let r=await fetch('/api/'+path,body?{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}:{});if(!r.ok)throw Error(await r.text());return r.json()}function show(v){el('details').textContent=JSON.stringify(v,null,2)}async function refresh(){let ss=await api('sessions');el('sessions').replaceChildren();for(let s of ss){let b=document.createElement('button');b.className='list-group-item list-group-item-action';b.textContent=s.title;b.onclick=()=>load(s.id);el('sessions').append(b)}}async function load(id){sid=id;el('messages').replaceChildren();for(let m of await api('sessions/'+id+'/messages'))render(m.role,m.content,m.citations)}function render(role,content,citations=[]){let d=document.createElement('div');d.className='border-bottom py-3';let p=document.createElement('pre');p.style.whiteSpace='pre-wrap';p.textContent=role+'
'+content;d.append(p);for(let c of citations){let a=document.createElement('button');a.className='btn btn-sm btn-link';a.textContent=c.location.path+':'+c.location.start_line;a.onclick=()=>show(c);d.append(a)}el('messages').append(d)}async function newSession(){sid=(await api('sessions',{})).id;el('messages').replaceChildren();refresh()}function query(){return {query:el('question').value,strategy:el('strategy').value,top_k:+el('top').value,rerank:el('rerank').checked}}async function send(){try{if(!sid)await newSession();let q=query();render('user',q.query);let r=await api('chat',{...q,session_id:sid,rag:el('rag').checked});render('assistant',r.answer,r.citations);show(r);refresh()}catch(e){show(e.message)}}async function debugSearch(){try{show(await api('search',query()))}catch(e){show(e.message)}}async function docs(){show(await api('documents'))}refresh().catch(e=>show(e.message));</script></body></html>
