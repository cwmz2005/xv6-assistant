[project]
name = "xv6-rag"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic-settings",
    "sqlalchemy",
    "psycopg[binary]",
    "pgvector",
    "rank-bm25",
    "sentence-transformers",
    "langchain-openai",
    "langchain-huggingface",
    "alembic",
    "pypdf>=7.0.0",
    "pymupdf>=2.1",
    "fonttools>=4.68.0",
    "psutil>=7.2.2",
]
[dependency-groups]
dev = [
    "pytest",
    "httpx",
    "ruff>=0.17.4",
]
[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
